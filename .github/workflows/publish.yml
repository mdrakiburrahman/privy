name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install locked build dependencies
        run: uv sync --locked --group dev --group binary

      - name: Build wheel
        run: uv build

      - name: Build static Linux x86_64 CLI
        run: ./scripts/build_binary.sh

      - name: Verify build artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(dist/privy-*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::Expected exactly one wheel in dist, found ${#wheels[@]}."
            exit 1
          fi
          if [[ ! -s "${wheels[0]}" ]]; then
            echo "::error::Wheel is missing or empty."
            exit 1
          fi
          if [[ ! -x dist/privy || ! -s dist/privy ]]; then
            echo "::error::Static CLI is missing, empty, or not executable."
            exit 1
          fi

          binary_info="$(file dist/privy)"
          if [[ "$binary_info" != *"ELF 64-bit"* || "$binary_info" != *"x86-64"* ]]; then
            echo "::error::CLI is not a Linux x86_64 ELF binary."
            exit 1
          fi
          if [[ "$binary_info" != *"statically linked"* ]]; then
            echo "::error::CLI is not statically linked."
            exit 1
          fi

      - name: Load publishing environment
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${BASE64_ENV:-}" ]]; then
            echo "::error::The production environment's BASE64_ENV secret is missing or empty."
            exit 1
          fi

          readonly env_file="${GITHUB_WORKSPACE}/.env"
          readonly github_env_file="${GITHUB_ENV}"
          trap 'rm -f -- "$env_file"' EXIT
          umask 077

          if ! printf '%s' "$BASE64_ENV" | base64 --decode > "$env_file"; then
            echo "::error::BASE64_ENV is not valid base64."
            exit 1
          fi
          unset BASE64_ENV
          chmod 600 "$env_file"

          set -a
          if ! source "$env_file" >/dev/null 2>&1; then
            set +x
            set +a
            echo "::error::Decoded BASE64_ENV could not be loaded."
            exit 1
          fi
          set +x
          set +a
          set -euo pipefail

          if [[ ! -v STORAGE_KEY || -z "$STORAGE_KEY" ]]; then
            echo "::error::STORAGE_KEY is missing or empty in BASE64_ENV."
            exit 1
          fi
          if [[ "$STORAGE_KEY" == *$'\n'* || "$STORAGE_KEY" == *$'\r'* ]]; then
            echo "::error::STORAGE_KEY must be a single-line value."
            exit 1
          fi

          PRIVY_STORAGE_ACCOUNT="${PRIVY_STORAGE_ACCOUNT:-rakirahman}"
          PRIVY_STORAGE_CONTAINER="${PRIVY_STORAGE_CONTAINER:-public}"

          for name in PRIVY_STORAGE_ACCOUNT PRIVY_STORAGE_CONTAINER; do
            value="${!name}"
            if [[ -z "$value" ]]; then
              echo "::error::${name} must not be empty."
              exit 1
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "::error::${name} must be a single-line value."
              exit 1
            fi
          done

          printf '::add-mask::%s\n' "$STORAGE_KEY"
          printf 'STORAGE_KEY=%s\n' "$STORAGE_KEY" >> "$github_env_file"
          printf 'PRIVY_STORAGE_ACCOUNT=%s\n' "$PRIVY_STORAGE_ACCOUNT" >> "$github_env_file"
          printf 'PRIVY_STORAGE_CONTAINER=%s\n' "$PRIVY_STORAGE_CONTAINER" >> "$github_env_file"

          optional=(
            PRIVY_BLOB_NAME
            PRIVY_WHL_PATH
            PRIVY_BIN_PATH
            PRIVY_BIN_BLOB_PREFIX
          )
          for name in "${optional[@]}"; do
            if [[ -v "$name" && -n "${!name}" ]]; then
              value="${!name}"
              if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
                echo "::error::${name} must be a single-line value."
                exit 1
              fi
              printf '%s=%s\n' "$name" "$value" >> "$github_env_file"
            fi
          done

      - name: Upload artifacts to Azure Storage
        run: ./scripts/upload_whl.sh

      - name: Clear publishing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "${GITHUB_WORKSPACE}/.env"
          printf 'STORAGE_KEY=\n' >> "$GITHUB_ENV"
