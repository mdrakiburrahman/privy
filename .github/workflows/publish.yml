name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  UV_PYTHON: "3.12"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Build release artifacts
        run: ./scripts/build_release.sh

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: privy-linux-release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/privy
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Build Windows CLI
        shell: pwsh
        run: .\scripts\build_binary.ps1

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: privy-windows-release-${{ github.sha }}
          path: dist/privy.exe
          if-no-files-found: error

  publish:
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Linux release artifacts
        uses: actions/download-artifact@v4
        with:
          name: privy-linux-release-${{ github.sha }}
          path: dist

      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: privy-windows-release-${{ github.sha }}
          path: dist

      - name: Publish release artifacts
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        run: ./scripts/publish_release.sh
