name: GCI endpoint metadata only
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gci
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract allowlisted endpoint metadata
        env:
          BASE64_ENV: ${{ secrets.BASE64_ENV }}
        shell: python
        run: |
          import base64
          import json
          import os
          import pathlib
          import re
          import shlex
          import sys

          def extract():
              raw = os.environ.pop("BASE64_ENV", "")
              if not raw or len(raw) > 131072:
                  raise ValueError()
              text = base64.b64decode(raw, validate=True).decode("utf-8")
              wanted = {"PRIVY_RELAY_NAMESPACE", "PRIVY_RELAY_PATH"}
              values = {}
              for line in text.splitlines():
                  tokens = shlex.split(line, comments=True, posix=True)
                  if not tokens:
                      continue
                  if tokens[0] == "export":
                      tokens = tokens[1:]
                  if len(tokens) != 1 or "=" not in tokens[0]:
                      raise ValueError()
                  name, value = tokens[0].split("=", 1)
                  if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", name):
                      raise ValueError()
                  if name in wanted:
                      if name in values or not value:
                          raise ValueError()
                      values[name] = value
              if set(values) != wanted:
                  raise ValueError()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9.-]{0,252}", values["PRIVY_RELAY_NAMESPACE"]):
                  raise ValueError()
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._~/-]{0,259}", values["PRIVY_RELAY_PATH"]):
                  raise ValueError()
              result = {
                  "endpoint": values,
                  "provenance": {
                      key: os.environ[key]
                      for key in ("GITHUB_REPOSITORY", "GITHUB_WORKFLOW", "GITHUB_WORKFLOW_REF",
                                  "GITHUB_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")
                  },
              }
              output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gci-endpoint-metadata.json"
              output.write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")

          try:
              extract()
          except Exception:
              print("Endpoint metadata extraction refused: invalid or ambiguous configuration.", file=sys.stderr)
              sys.exit(1)
      - name: Upload allowlisted metadata
        uses: actions/upload-artifact@v4
        with:
          name: gci-endpoint-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/gci-endpoint-metadata.json
          if-no-files-found: error
          retention-days: 1
